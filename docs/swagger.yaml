securityDefinitions:
  ApiKeyAuth:
    description: API token authentication via the X-Api-Token header. The token authenticates
      as the service principal, which bypasses every authorization gate.
    in: header
    name: X-Api-Token
    type: apiKey
  BearerAuth:
    description: 'OIDC bearer token. In the Swagger Authorize dialog type "Bearer
      <jwt>" with the Bearer prefix and a space: the value is sent verbatim as the
      Authorization header. The engine is a resource server: the frontend completes
      a code+PKCE flow against the provider and calls the API with the JWT. The authorization
      URL, client id, and scopes are served by GET /v1/auth/config.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
