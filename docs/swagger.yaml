basePath: /
definitions:
  internal_workflow_handler.AuthConfigResponse:
    properties:
      api_token_enabled:
        type: boolean
      audience:
        description: |-
          Audience is the value a token's aud claim must carry for this API. It
          is the verifier's audience, so a frontend knows whether to request a
          distinct resource audience or whether the client id already serves as
          one.
        type: string
      authorization_url:
        type: string
      client_id:
        type: string
      enabled:
        type: boolean
      issuer:
        type: string
      roles:
        description: |-
          Roles is every role name the configured catalog knows, so a frontend
          can label a role before the caller has one.
        items:
          type: string
        type: array
      roles_claim:
        type: string
      scopes:
        items:
          type: string
        type: array
      token_url:
        type: string
    type: object
  internal_workflow_handler.AuthMeResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        description: |-
          Permission is the union of the caller's role permissions, or ["*"]
          for the service principal.
        items:
          type: string
        type: array
      roles:
        description: |-
          Roles are the roles the live token asserted. An empty array means the
          caller is authenticated but holds no role.
        items:
          type: string
        type: array
      service:
        description: Service marks the API-token principal, which bypasses authorization.
        type: boolean
      subject:
        type: string
    type: object
  internal_workflow_handler.CreateInstanceRequest:
    properties:
      context:
        items:
          type: integer
        type: array
      debug:
        description: |-
          Debug starts a step-through run: paused at create, re-paused after
          every node until termination. Immutable after create.
        type: boolean
      workflow_definition_id:
        type: string
    type: object
  internal_workflow_handler.CreateInstanceResponse:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  internal_workflow_handler.CreateNodeDefinitionRequest:
    properties:
      content:
        type: object
      name:
        type: string
      previous_version_id:
        type: string
      type:
        type: string
    type: object
  internal_workflow_handler.CreateSecretRequest:
    properties:
      key:
        type: string
      value:
        maxLength: 8192
        minLength: 1
        type: string
    required:
    - key
    - value
    type: object
  internal_workflow_handler.CreateWorkflowDefinitionRequest:
    properties:
      content:
        type: object
      name:
        type: string
      previous_version_id:
        type: string
    type: object
  internal_workflow_handler.DebugContextResponse:
    properties:
      attempt:
        type: integer
      instance_id:
        type: string
      is_debug_paused:
        type: boolean
      node_id:
        type: string
      occurrence_id:
        type: string
      typescript:
        type: string
    type: object
  internal_workflow_handler.InputDeliveryResponse:
    properties:
      accepted:
        type: boolean
      error:
        type: string
    type: object
  internal_workflow_handler.InputFormDTO:
    properties:
      schema:
        type: object
      ui:
        type: object
    type: object
  internal_workflow_handler.InstanceContextResponse:
    properties:
      context:
        items:
          type: integer
        type: array
      id:
        type: string
    type: object
  internal_workflow_handler.InstanceStatusResponse:
    properties:
      attempt:
        type: integer
      context_mode:
        type: string
      counters:
        items:
          type: integer
        type: array
      created_at:
        type: string
      created_by:
        type: string
      current_group_id:
        type: string
      current_node_id:
        type: string
      current_node_instance_id:
        type: string
      debug:
        type: boolean
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      nodes:
        additionalProperties:
          $ref: '#/definitions/internal_workflow_handler.NodeOccurrenceResponse'
        type: object
      parallel:
        items:
          $ref: '#/definitions/internal_workflow_handler.ParallelExecutionResponse'
        type: array
      pause_requested:
        type: boolean
      pending_input:
        $ref: '#/definitions/internal_workflow_handler.PendingInputResponse'
      started_at:
        type: string
      status:
        type: string
      termination_pending:
        type: boolean
      updated_at:
        type: string
      updated_by:
        type: string
      waiting_reason:
        type: string
      workflow_definition_id:
        type: string
    type: object
  internal_workflow_handler.InstanceSummaryResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      debug:
        type: boolean
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      pause_requested:
        type: boolean
      started_at:
        type: string
      status:
        type: string
      termination_pending:
        type: boolean
      updated_at:
        type: string
      updated_by:
        type: string
      waiting_reason:
        type: string
      workflow_definition_id:
        type: string
    type: object
  internal_workflow_handler.ListResponse-internal_workflow_handler_InstanceSummaryResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_workflow_handler.InstanceSummaryResponse'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_workflow_handler.ListResponse-internal_workflow_handler_NodeDefinitionResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_workflow_handler.NodeDefinitionResponse'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_workflow_handler.ListResponse-internal_workflow_handler_SecretResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_workflow_handler.SecretResponse'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_workflow_handler.ListResponse-internal_workflow_handler_WorkflowDefinitionResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_workflow_handler.WorkflowDefinitionResponse'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_workflow_handler.NodeDebugResponse:
    properties:
      attempt_count:
        type: integer
      cancelled:
        type: boolean
      context_after:
        items:
          type: integer
        type: array
      context_before:
        items:
          type: integer
        type: array
      created_at:
        type: string
      duration_ms:
        type: integer
      error:
        type: string
      finished_at:
        type: string
      input:
        items:
          type: integer
        type: array
      latest_attempt:
        type: integer
      name:
        type: string
      occurrence_id:
        type: string
      output:
        items:
          type: integer
        type: array
      recovery_policy:
        type: string
      recovery_result:
        type: string
      selected_attempt:
        type: integer
      source_node_definition_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      stopped_at:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  internal_workflow_handler.NodeDefinitionResponse:
    properties:
      content:
        type: object
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      lineage_id:
        type: string
      name:
        type: string
      previous_version_id:
        type: string
      schema:
        description: |-
          Schema is the full node-object JSON Schema for Type, or null when
          the type is unknown to this build. It describes the inline
          workflow-occurrence shape; content is the same object minus the
          graph routing fields, which a frontend ignores here.
        type: object
      type:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  internal_workflow_handler.NodeOccurrenceResponse:
    properties:
      attempt:
        type: integer
      occurrence_id:
        type: string
      rollbackable:
        type: boolean
      status:
        type: string
    type: object
  internal_workflow_handler.ParallelBranchResponse:
    properties:
      branch_index:
        type: integer
      error:
        type: string
      id:
        type: string
      name:
        type: string
      start_node_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      waiting_reason:
        type: string
    type: object
  internal_workflow_handler.ParallelExecutionResponse:
    properties:
      branch_count:
        type: integer
      branches:
        items:
          $ref: '#/definitions/internal_workflow_handler.ParallelBranchResponse'
        type: array
      completed_count:
        type: integer
      depth:
        type: integer
      end_node_id:
        type: string
      id:
        type: string
      parent_branch_id:
        type: string
      start_node_id:
        type: string
      status:
        type: string
    type: object
  internal_workflow_handler.PauseResponse:
    properties:
      pause_requested:
        type: boolean
      status:
        type: string
    type: object
  internal_workflow_handler.PendingInputResponse:
    properties:
      allowed_roles:
        description: |-
          AllowedRoles is the node's role gate. Empty means the node is open to
          any caller that holds input:deliver.
        items:
          type: string
        type: array
      channel:
        type: string
      form:
        $ref: '#/definitions/internal_workflow_handler.InputFormDTO'
      node_id:
        type: string
      output_property:
        type: string
      public:
        description: |-
          Public reports that the node accepts anonymous deliveries over HTTP
          with no credential, even when auth is on. Status and form reads stay
          authenticated, so an anonymous caller learns the shape out-of-band.
        type: boolean
      record_actor:
        description: |-
          RecordActor reports that an accepted delivery is written as the
          attribution envelope {user_id, input_data} rather than the bare
          payload, so the frontend knows which shape the context will hold.
        type: boolean
    type: object
  internal_workflow_handler.Problem:
    properties:
      detail:
        type: string
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  internal_workflow_handler.ResumeResponse:
    properties:
      status:
        type: string
    type: object
  internal_workflow_handler.RoleListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_workflow_handler.RoleResponse'
        type: array
    type: object
  internal_workflow_handler.RoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  internal_workflow_handler.RollbackRequest:
    properties:
      reason:
        type: string
      target_occurrence_id:
        type: string
    type: object
  internal_workflow_handler.RollbackResponse:
    properties:
      current_node_id:
        type: string
      status:
        type: string
    type: object
  internal_workflow_handler.RunsPerDayResponse:
    properties:
      date:
        type: string
      failed_runs:
        type: integer
      finished_runs:
        type: integer
      stopped_runs:
        type: integer
      total_runs:
        type: integer
    type: object
  internal_workflow_handler.SecretResponse:
    properties:
      created_at:
        format: date-time
        type: string
      key:
        type: string
      updated_at:
        format: date-time
        type: string
      value_masked:
        enum:
        - '********'
        type: string
    required:
    - created_at
    - key
    - updated_at
    - value_masked
    type: object
  internal_workflow_handler.StatisticsSummaryResponse:
    properties:
      active_runs:
        type: integer
      average_duration_ms:
        type: number
      failed_runs:
        type: integer
      finished_runs:
        type: integer
      runs_per_day:
        items:
          $ref: '#/definitions/internal_workflow_handler.RunsPerDayResponse'
        type: array
      stopped_runs:
        type: integer
      success_rate:
        type: number
      terminal_runs:
        type: integer
      total_runs:
        type: integer
    type: object
  internal_workflow_handler.StopResponse:
    properties:
      status:
        type: string
      termination_pending:
        type: boolean
    type: object
  internal_workflow_handler.WorkflowDefinitionResponse:
    properties:
      content:
        type: object
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      lineage_id:
        type: string
      name:
        type: string
      previous_version_id:
        type: string
      schemas:
        description: |-
          Schemas holds the node-object JSON Schema of every node type this
          definition actually uses, keyed by type. It is computed on read from
          the current code, so it describes the current engine, not the code
          the definition was authored against.
        type: object
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
info:
  contact: {}
  description: Workflow definition and execution API.
  title: SimpWF API
  version: "1.0"
paths:
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
  /v1/auth/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.AuthConfigResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      summary: Get the OIDC login contract
      tags:
      - auth
  /v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.AuthMeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get the authenticated caller
      tags:
      - auth
  /v1/node/definition:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Sort order
        in: query
        name: order
        type: string
      - collectionFormat: csv
        description: Definition IDs
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: Name filter
        in: query
        name: name
        type: string
      - description: Lineage ID
        in: query
        name: lineage_id
        type: string
      - description: Version
        in: query
        name: version
        type: integer
      - description: Only latest versions
        in: query
        name: latest_only
        type: boolean
      - description: Node type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.ListResponse-internal_workflow_handler_NodeDefinitionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List node definitions
      tags:
      - node-definitions
    post:
      consumes:
      - application/json
      parameters:
      - description: Node definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_workflow_handler.CreateNodeDefinitionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_workflow_handler.NodeDefinitionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create node definition
      tags:
      - node-definitions
  /v1/node/definition/{id}:
    delete:
      parameters:
      - description: Definition ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete node definition
      tags:
      - node-definitions
    get:
      parameters:
      - description: Definition ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.NodeDefinitionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get node definition
      tags:
      - node-definitions
  /v1/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.RoleListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List roles and their permissions
      tags:
      - auth
  /v1/roles/{name}:
    get:
      parameters:
      - description: Role name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.RoleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get one role and its permissions
      tags:
      - auth
  /v1/secrets:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_workflow_handler.ListResponse-internal_workflow_handler_SecretResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List secrets
      tags:
      - secrets
    post:
      consumes:
      - application/json
      parameters:
      - description: Secret
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_workflow_handler.CreateSecretRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_workflow_handler.SecretResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_workflow_handler.Problem'
      security:
