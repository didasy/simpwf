# Local stack: PostgreSQL + Atlas migrations + Redis + RabbitMQ + RustFS (S3) + app.
# Redis and RabbitMQ are optional: the app starts them only when their DSNs
# are configured. The migrate service waits for a healthy database; the app
# waits for the migration plus healthy brokers before starting the API,
# dispatcher, and broker consumers. RustFS backs the s3fetch example custom
# node (see pkg/customnode/s3fetch/README.md).
#
#   docker compose up --build
#   curl http://localhost:8080/health/ready
#   RabbitMQ management UI: http://localhost:15672 (simpwf/simpwf)
#   RustFS console: http://localhost:9001 (rustfsadmin/rustfsadmin)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: gorm
      POSTGRES_DB: gorm
    ports:
      - "9921:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm -d gorm"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # Local-development credentials; change for anything beyond local use.
      RABBITMQ_DEFAULT_USER: simpwf
      RABBITMQ_DEFAULT_PASS: simpwf
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  migrate:
    image: arigaio/atlas:1.3.0
    command:
      - migrate
      - apply
      - --url
      - postgres://gorm:gorm@db:5432/gorm?sslmode=disable
      - --dir
      - file:///migrations/versions
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # RustFS volume permissions fixer: the RustFS image runs as 10001:10001,
  # so the named volumes need that ownership before the server starts.
  rustfs-permission-helper:
    image: alpine
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3
      - rustfs_logs:/logs
    command: >
      sh -c "
      chown -R 10001:10001 /data0 /data1 /data2 /data3 /logs &&
      echo 'Volume permissions fixed' &&
      exit 0
      "
    restart: "no"

  # S3-compatible object storage backing the s3fetch example custom node.
  # Single node, 4 local drives (erasure layout needs >= 4 paths), plain
  # HTTP for local dev. s3fetch renders connection fields from
  # {{ env.SIMPWF_S3_* }}, set on the app service below.
  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      - rustfs-permission-helper
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # Local-development credentials; change for anything beyond local use.
      - RUSTFS_ACCESS_KEY=rustfsadmin # CHANGEME
      - RUSTFS_SECRET_KEY=rustfsadmin # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
      # Local dev only: all four paths sit on same Docker disk, so RustFS
      # erasure disk check fails without this. Never enable beyond local testing.
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
      - rustfs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      SIMPWF_INFRA_HTTP_HOST: 0.0.0.0:8080
      SIMPWF_INFRA_POSTGRESQL_DSN: host=db user=gorm password=gorm dbname=gorm port=5432 sslmode=disable
      SIMPWF_INFRA_REDIS_DSN: redis://redis:6379/0
      SIMPWF_INFRA_RABBITMQ_DSN: amqp://simpwf:simpwf@rabbitmq:5672/
      SIMPWF_INFRA_RABBITMQ_INPUT_QUEUE: simpwf.input
      SIMPWF_INFRA_RABBITMQ_OUTPUT_QUEUE: simpwf.output
      SIMPWF_INFRA_RABBITMQ_STATUS_QUEUE: simpwf.status
      SIMPWF_AUTH_ENABLED: "false"
      SIMPWF_API_TOKEN: "wadidaw"
      SIMPWF_WORKER_POOL_SIZE: "50"
      SIMPWF_ENGINE_DEFAULT_NODE_TIMEOUT: 30s
      SIMPWF_ENGINE_MAX_NODE_TIMEOUT: 5m
      SIMPWF_ENGINE_CONDITION_TIMEOUT: 5s
      SIMPWF_ENGINE_LEASE_DURATION: 30s
      SIMPWF_ENGINE_CLAIM_BATCH_SIZE: "10"
      # Dev convenience: allow any outbound HTTP target (the engine logs a
      # warning). Remove or tighten for anything beyond local testing.
      SIMPWF_ENGINE_HTTP_ALLOWLIST: "*"
      SIMPWF_SYSTEM_USER_ID: "00000000-0000-7000-8000-000000000001"
      SIMPWF_SYSTEM_NAME: system
      SIMPWF_SYSTEM_EMAIL: system@localhost
      # S3 connection for the s3fetch example custom node. Create snapshots
      # SIMPWF_* into each instance context under {{ env.* }}, so s3fetch
      # configs use {{ env.SIMPWF_S3_ENDPOINT }} etc. (see
      # pkg/customnode/s3fetch/README.md). rustfs runs plain HTTP locally,
      # so use_ssl=false configs match; console at localhost:9001.
      SIMPWF_S3_ENDPOINT: rustfs:9000
      SIMPWF_S3_ACCESS_KEY: rustfsadmin
      SIMPWF_S3_SECRET_KEY: rustfsadmin
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  rustfs_logs:
