# Local stack: PostgreSQL + Atlas migrations + Redis + RabbitMQ + app.
# Redis and RabbitMQ are optional: the app starts them only when their DSNs
# are configured. The migrate service waits for a healthy database; the app
# waits for the migration plus healthy brokers before starting the API,
# dispatcher, and broker consumers.
#
#   docker compose up --build
#   curl http://localhost:8080/health/ready
#   RabbitMQ management UI: http://localhost:15672 (simpwf/simpwf)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gorm
      POSTGRES_PASSWORD: gorm
      POSTGRES_DB: gorm
    ports:
      - "9921:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorm -d gorm"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # Local-development credentials; change for anything beyond local use.
      RABBITMQ_DEFAULT_USER: simpwf
      RABBITMQ_DEFAULT_PASS: simpwf
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  migrate:
    image: arigaio/atlas:1.3.0
    command:
      - migrate
      - apply
      - --url
      - postgres://gorm:gorm@db:5432/gorm?sslmode=disable
      - --dir
      - file:///migrations/versions
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      SIMPWF_INFRA_HTTP_HOST: 0.0.0.0:8080
      SIMPWF_INFRA_POSTGRESQL_DSN: host=db user=gorm password=gorm dbname=gorm port=5432 sslmode=disable
      SIMPWF_INFRA_REDIS_DSN: redis://redis:6379/0
      SIMPWF_INFRA_RABBITMQ_DSN: amqp://simpwf:simpwf@rabbitmq:5672/
      SIMPWF_INFRA_RABBITMQ_INPUT_QUEUE: simpwf.input
      SIMPWF_INFRA_RABBITMQ_OUTPUT_QUEUE: simpwf.output
      SIMPWF_INFRA_RABBITMQ_STATUS_QUEUE: simpwf.status
      SIMPWF_AUTH_ENABLED: "false"
      SIMPWF_API_TOKEN: "wadidaw"
      SIMPWF_WORKER_POOL_SIZE: "50"
      SIMPWF_ENGINE_DEFAULT_NODE_TIMEOUT: 30s
      SIMPWF_ENGINE_MAX_NODE_TIMEOUT: 5m
      SIMPWF_ENGINE_CONDITION_TIMEOUT: 5s
      SIMPWF_ENGINE_LEASE_DURATION: 30s
      SIMPWF_ENGINE_CLAIM_BATCH_SIZE: "10"
      # Dev convenience: allow any outbound HTTP target (the engine logs a
      # warning). Remove or tighten for anything beyond local testing.
      SIMPWF_ENGINE_HTTP_ALLOWLIST: "*"
      SIMPWF_SYSTEM_USER_ID: "00000000-0000-7000-8000-000000000001"
      SIMPWF_SYSTEM_NAME: system
      SIMPWF_SYSTEM_EMAIL: system@localhost
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
