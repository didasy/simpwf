# SimpWF developer task runner (go-task: https://taskfile.dev).
# Usage: task build, task test, task migrate-up, ...

version: "3"

vars:
  DSN: 'host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable'
  # Atlas needs a driver-qualified URL (postgres://); the bare host=... DSN is pgx-only.
  ATLAS_DEV_URL: 'postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable'
  TEST_DSN: '{{.DSN}}'
  TEST_DSN_ENGINE: 'host=localhost user=gorm password=gorm dbname=simpwf_test_engine port=9921 sslmode=disable'
  TEST_DSN_SERVICE: 'host=localhost user=gorm password=gorm dbname=simpwf_test_service port=9921 sslmode=disable'
  TEST_DSN_APP: 'host=localhost user=gorm password=gorm dbname=simpwf_test_app port=9921 sslmode=disable'
  TEST_DSN_STATUSUPDATE: 'host=localhost user=gorm password=gorm dbname=simpwf_test_statusupdate port=9921 sslmode=disable'

tasks:
  build:
    desc: Build the app binary
    cmds:
      - go build ./...

  run:
    desc: Run the app against config.yaml
    cmds:
      - go run ./cmd/app -config config.yaml

  test:
    desc: Run the full test suite (needs a local PostgreSQL on :9921)
    cmds:
      - TEST_DATABASE_DSN='{{.TEST_DSN}}' TEST_DATABASE_DSN_ENGINE='{{.TEST_DSN_ENGINE}}' TEST_DATABASE_DSN_SERVICE='{{.TEST_DSN_SERVICE}}' TEST_DATABASE_DSN_APP='{{.TEST_DSN_APP}}' TEST_DATABASE_DSN_STATUSUPDATE='{{.TEST_DSN_STATUSUPDATE}}' go test ./... -count=1

  test-race:
    desc: Run the full suite under the race detector
    cmds:
      - TEST_DATABASE_DSN='{{.TEST_DSN}}' TEST_DATABASE_DSN_ENGINE='{{.TEST_DSN_ENGINE}}' TEST_DATABASE_DSN_SERVICE='{{.TEST_DSN_SERVICE}}' TEST_DATABASE_DSN_APP='{{.TEST_DSN_APP}}' TEST_DATABASE_DSN_STATUSUPDATE='{{.TEST_DSN_STATUSUPDATE}}' go test -race ./... -count=1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w $$(find . -name '*.go' -not -path './vendor/*')

  swagger:
    desc: Generate Swaggo documentation
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo cmd/app/main.go --output docs --parseDependency --parseInternal

  migrate-up:
    desc: Apply Atlas migrations to the dev database
    cmds:
      - atlas migrate apply --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  migrate-diff:
    desc: Generate a new Atlas migration from the GORM models
    cmds:
      - atlas migrate diff add_ --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  migrate-lint:
    desc: Validate the migration directory (checksums + replay); lint is Pro-only in atlas >= v0.38
    cmds:
      - atlas migrate validate --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  e2e:
    desc: Black-box API checks against a running app
    cmds:
      - bash scripts/e2e.sh
