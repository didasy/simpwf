# SimpWF developer task runner (go-task: https://taskfile.dev).
# Usage: task build, task test, task migrate-up, ...

version: "3"

vars:
  DSN: 'host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable'
  # Atlas needs a driver-qualified URL (postgres://); the bare host=... DSN is pgx-only.
  ATLAS_DEV_URL: 'postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable'
  TEST_DSN: '{{.DSN}}'
  TEST_DSN_ENGINE: 'host=localhost user=gorm password=gorm dbname=simpwf_test_engine port=9921 sslmode=disable'
  TEST_DSN_SERVICE: 'host=localhost user=gorm password=gorm dbname=simpwf_test_service port=9921 sslmode=disable'
  TEST_DSN_APP: 'host=localhost user=gorm password=gorm dbname=simpwf_test_app port=9921 sslmode=disable'
  TEST_DSN_STATUSUPDATE: 'host=localhost user=gorm password=gorm dbname=simpwf_test_statusupdate port=9921 sslmode=disable'

tasks:
  build:
    desc: Build the app binary
    cmds:
      - go build ./...

  run:
    desc: Run the app against config.yaml
    cmds:
      - go run ./cmd/app -config config.yaml

  test:
    desc: Run the full test suite (needs a local PostgreSQL on :9921)
    cmds:
      - TEST_DATABASE_DSN='{{.TEST_DSN}}' TEST_DATABASE_DSN_ENGINE='{{.TEST_DSN_ENGINE}}' TEST_DATABASE_DSN_SERVICE='{{.TEST_DSN_SERVICE}}' TEST_DATABASE_DSN_APP='{{.TEST_DSN_APP}}' TEST_DATABASE_DSN_STATUSUPDATE='{{.TEST_DSN_STATUSUPDATE}}' go test ./... -count=1

  test-race:
    desc: Run the full suite under the race detector
    cmds:
      - TEST_DATABASE_DSN='{{.TEST_DSN}}' TEST_DATABASE_DSN_ENGINE='{{.TEST_DSN_ENGINE}}' TEST_DATABASE_DSN_SERVICE='{{.TEST_DSN_SERVICE}}' TEST_DATABASE_DSN_APP='{{.TEST_DSN_APP}}' TEST_DATABASE_DSN_STATUSUPDATE='{{.TEST_DSN_STATUSUPDATE}}' go test -race ./... -count=1

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w $$(find . -name '*.go' -not -path './vendor/*')

  swagger:
    desc: Generate Swaggo documentation
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo cmd/app/main.go --output docs --parseDependency --parseInternal

  migrate-up:
    desc: Apply Atlas migrations to the dev database
    cmds:
      - atlas migrate apply --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  migrate-diff:
    desc: Generate a new Atlas migration from the GORM models
    cmds:
      - atlas migrate diff add_ --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  migrate-lint:
    desc: Validate the migration directory (checksums + replay); lint is Pro-only in atlas >= v0.38
    cmds:
      - atlas migrate validate --config file://migrations/atlas.hcl --env gorm --var dev_url='{{.ATLAS_DEV_URL}}'

  e2e:
    desc: Black-box API checks against a running app
    cmds:
      - bash scripts/e2e.sh

  # Stands the app up against config.e2e-oidc.yaml (throwaway mock provider,
  # API token on), then drives the OIDC + RBAC + input-gate + attribution flow
  # black-box. The mock provider is started first because the app performs
  # discovery at boot; the script detects it is already listening and reuses
  # it rather than binding the port twice.
  #
  # The target is self-contained: it creates the throwaway database and
  # applies the migrations, so it does not depend on a developer having run
  # `task migrate-up` against the shared `gorm` database first. The app
  # never migrates, and a test that silently ran against a half-migrated
  # database would report a schema error as an auth failure.
  e2e-oidc:
    desc: Black-box OIDC/RBAC checks against a locally started app
    cmds:
      - |
        set -euo pipefail
        # The single source for the service credential: the app reads it
        # through auth.api_token's SIMPWF_API_TOKEN binding, and the script
        # reads the same variable. config.e2e-oidc.yaml deliberately leaves
        # the key out.
        export SIMPWF_API_TOKEN="e2e-service-token"
        # Throwaway database for this run. Recreating it keeps a previous
        # run's definitions and instances from changing what the checks see.
        export PGPASSWORD=gorm
        psql -h localhost -p 9921 -U gorm -d postgres -c 'DROP DATABASE IF EXISTS simpwf_e2e WITH (FORCE)' >/dev/null
        psql -h localhost -p 9921 -U gorm -d postgres -c 'CREATE DATABASE simpwf_e2e' >/dev/null
        docker run --rm --network host -v "$PWD/migrations:/migrations:ro" arigaio/atlas:1.3.0 \
          migrate apply \
          --url "postgres://gorm:gorm@localhost:9921/simpwf_e2e?sslmode=disable" \
          --dir "file:///migrations/versions" >/dev/null
        python3 scripts/mock_oidc_provider.py http://127.0.0.1:9099 &
        mock_pid=$!
        trap 'kill $mock_pid 2>/dev/null || true' EXIT
        for _ in $(seq 1 50); do
          curl -fsS http://127.0.0.1:9099/.well-known/openid-configuration >/dev/null 2>&1 && break
          sleep 0.2
        done
        go run ./cmd/app -config config.e2e-oidc.yaml &
        app_pid=$!
        trap 'kill $app_pid $mock_pid 2>/dev/null || true' EXIT
        for _ in $(seq 1 60); do
          curl -fsS http://127.0.0.1:9999/health/live >/dev/null 2>&1 && break
          sleep 1
        done
        bash scripts/e2e-oidc.sh http://127.0.0.1:9999 http://127.0.0.1:9099
