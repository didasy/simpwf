name: "Go Coverage Guard"

on:
  push:
    branches: [main] # Required so the action stores baseline coverage notes
  pull_request:
    branches: [main]

jobs:
  coverage-check: # <--- Job name GitHub tracks; select as required status check
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to read/write git notes for coverage tracking
      pull-requests: write # Needed to post coverage comments on PRs
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: gorm
          POSTGRES_PASSWORD: gorm
          POSTGRES_DB: gorm
        ports:
          - 9921:5432
        options: >-
          --health-cmd "pg_isready -U gorm -d gorm"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # dbname is credentials-only and ignored: internal/workflow/testdb
      # auto-provisions one scratch database per suite from this DSN.
      TEST_DATABASE_DSN: host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 10 # Required to find previous git notes for delta checks

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run Go Coverage Action
        uses: gwatts/go-coverage-action@2845595538a59d63d1bf55f109c14e104c6f7cb3 # v2
        with:
          coverage-threshold: 75
          fail-coverage: always
          ignore-pattern: |
            /docs/
            /cmd/
