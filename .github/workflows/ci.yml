name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: gorm
          POSTGRES_PASSWORD: gorm
          POSTGRES_DB: gorm
        ports:
          - 9921:5432
        options: >-
          --health-cmd "pg_isready -U gorm -d gorm"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      # dbname is credentials-only and ignored: internal/workflow/testdb
      # auto-provisions one scratch database per suite from this DSN.
      TEST_DATABASE_DSN: host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: No DB skips outside testdb helper
        run: |
          if grep -rn 't\.Skip("TEST_DATABASE_DSN' --include='*_test.go' internal pkg cmd | grep -v 'internal/workflow/testdb/'; then
            echo "DB tests must route skips through internal/workflow/testdb (fail-loud full mode, SHORT-MODE-SKIP under -short)"
            exit 1
          fi
      - name: go test
        run: go test ./... -count=1
      - name: go test -race
        run: go test -race ./... -count=1
      - name: Per-package coverage floors (DB suites)
        # Floors = measured 2026-10-06 minus 5pp slack. Measured with live
        # Postgres and a single TEST_DATABASE_DSN: service 82.5, engine 71.8,
        # repository 76.4, statusupdate 80.7, app 58.8, database 82.4.
        run: |
          go test -coverprofile=/tmp/cover.out ./... -count=1
          awk '
            BEGIN {
              floors["internal/workflow/service"] = 77
              floors["internal/workflow/engine"] = 66
              floors["internal/workflow/repository"] = 71
              floors["internal/workflow/statusupdate"] = 75
              floors["cmd/app"] = 53
              floors["pkg/database"] = 77
            }
            NR > 1 {
              file = $1
              pkg = ""
              for (p in floors) {
                if (index(file, p "/") > 0) { pkg = p; break }
              }
              if (pkg == "") { next }
              stmts[pkg] += $2
              if ($3 > 0) { covered[pkg] += $2 }
            }
            END {
              fail = 0
              for (p in floors) {
                pct = (stmts[p] > 0) ? 100 * covered[p] / stmts[p] : 0
                printf "%s: %.1f%% (floor %d%%)\n", p, pct, floors[p]
                if (pct < floors[p]) {
                  printf "FAIL: %s %.1f%% below floor %d%%\n", p, pct, floors[p]
                  fail = 1
                }
              }
              if (fail) { exit 1 }
            }
          ' /tmp/cover.out
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # goinstall builds the linter with this repo's Go toolchain
          # (setup-go reads go.mod). Prebuilt binaries lag the toolchain and
          # panic on packages requiring a newer Go version. v2.14.0 is the
          # verified floor: its staticcheck parses Go 1.27 stdlib sources,
          # while v2.12.x panics in buildir.
          install-mode: goinstall
          version: v2.14.0
          args: --timeout 5m

  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: gorm
          POSTGRES_PASSWORD: gorm
          POSTGRES_DB: gorm
        ports:
          - 9921:5432
        options: >-
          --health-cmd "pg_isready -U gorm -d gorm"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: v1.3.0
      - name: Atlas validate (replay migration directory on a clean DB)
        run: |
          PGPASSWORD=gorm createdb -h localhost -p 9921 -U gorm simpwf_ci_validate
          atlas migrate validate \
            --config file://migrations/atlas.hcl --env gorm \
            --var dev_url='postgres://gorm:gorm@localhost:9921/simpwf_ci_validate?sslmode=disable'
      - name: Atlas apply
        run: |
          atlas migrate apply \
            --config file://migrations/atlas.hcl --env gorm \
            --url 'postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable' \
            --var dev_url='postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable'

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: go.mod/go.sum tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Go toolchain drift guard
        run: |
          # go.mod, Dockerfile, and .golangci.yml must agree on the Go minor
          # version. Skew panics prebuilt linters and stale build images.
          mod="$(grep -m1 -oP '^go \K[0-9]+\.[0-9]+' go.mod)"
          img="$(grep -m1 -oP 'golang:\K[0-9]+\.[0-9]+' Dockerfile)"
          cfg="$(grep -m1 -oP '^\s+go: "\K[0-9]+\.[0-9]+' .golangci.yml)"
          echo "go.mod=$mod Dockerfile=$img .golangci.yml=$cfg"
          test "$mod" = "$img" && test "$mod" = "$cfg"
      - name: govulncheck (reachable vulnerabilities fail the build)
        run: go tool govulncheck ./...
      - name: osv-scanner (all known vulnerabilities fail the build)
        run: go tool osv-scanner --lockfile=go.mod .
      - name: SBOM (SPDX JSON artifact)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./
          format: spdx-json
