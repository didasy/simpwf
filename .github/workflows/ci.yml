name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gorm
          POSTGRES_PASSWORD: gorm
          POSTGRES_DB: gorm
        ports:
          - 9921:5432
        options: >-
          --health-cmd "pg_isready -U gorm -d gorm"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_DSN: host=localhost user=gorm password=gorm dbname=gorm port=9921 sslmode=disable
      TEST_DATABASE_DSN_ENGINE: host=localhost user=gorm password=gorm dbname=simpwf_test_engine port=9921 sslmode=disable
      TEST_DATABASE_DSN_SERVICE: host=localhost user=gorm password=gorm dbname=simpwf_test_service port=9921 sslmode=disable
      TEST_DATABASE_DSN_APP: host=localhost user=gorm password=gorm dbname=simpwf_test_app port=9921 sslmode=disable
      TEST_DATABASE_DSN_STATUSUPDATE: host=localhost user=gorm password=gorm dbname=simpwf_test_statusupdate port=9921 sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Create scratch test databases
        run: |
          for db in simpwf_test_engine simpwf_test_service simpwf_test_app simpwf_test_statusupdate; do
            PGPASSWORD=gorm createdb -h localhost -p 9921 -U gorm "$db"
          done
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: go test -race
        run: go test -race ./... -count=1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
          args: --timeout 5m

  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gorm
          POSTGRES_PASSWORD: gorm
          POSTGRES_DB: gorm
        ports:
          - 9921:5432
        options: >-
          --health-cmd "pg_isready -U gorm -d gorm"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: ariga/setup-atlas@v0
        with:
          version: v1.3.0
      - name: Atlas validate (replay migration directory on a clean DB)
        run: |
          PGPASSWORD=gorm createdb -h localhost -p 9921 -U gorm simpwf_ci_validate
          atlas migrate validate \
            --config file://migrations/atlas.hcl --env gorm \
            --var dev_url='postgres://gorm:gorm@localhost:9921/simpwf_ci_validate?sslmode=disable'
      - name: Atlas apply
        run: |
          atlas migrate apply \
            --config file://migrations/atlas.hcl --env gorm \
            --url 'postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable' \
            --var dev_url='postgres://gorm:gorm@localhost:9921/gorm?sslmode=disable'
