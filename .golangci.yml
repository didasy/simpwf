version: "2"

run:
  # Tracks the go directive in go.mod (drift guard in CI enforces this).
  go: "1.27"

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
  disable:
    - depguard
    - gochecknoglobals
    - gochecknoinits
    - cyclop
    - funlen
    - gocognit
    - maintidx
    - nestif
    - lll
    - wsl
