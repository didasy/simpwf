# Single-origin front door for the local stack: the UI owns every path
# except /api, which proxies to the SimpWF engine with the prefix stripped.
# The path reservation comes from the simpwf-ui maintainer: all paths are
# frontend routes except /api, /simpwf and /simpwf-engine.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream ui {
    server ui:80;
}

upstream api {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # Bare /api without trailing slash: normalize so probes and relative
    # resolution behave the same as /api/.
    location = /api {
        return 301 $scheme://$http_host/api/;
    }

    location /api/ {
        # Trailing slash on proxy_pass strips the /api prefix.
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The UI can open SSE/WebSocket streams on the API origin; streams
        # must not be buffered and outlive the default 60s read timeout.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://ui;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
